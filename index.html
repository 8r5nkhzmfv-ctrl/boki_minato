<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ミナトの帳簿 ― 取引45の型</title>
<link rel="stylesheet" href="nv.css">
</head>
<body>
<div id="app">
  <div id="bg"><div class="bl"></div><div class="bl"></div></div>
  <div id="stage"></div>
  <div id="bar">
    <button id="b-auto">自動</button><button id="b-log">ログ</button><button id="b-map">型マップ</button><button id="b-eps">話</button><button id="b-set">設定</button>
  </div>
  <div id="win"><div id="plate"></div><div id="txt"></div><span id="cur" hidden>▼</span></div>
  <div id="banner"></div>
  <div id="card" hidden></div>
  <div id="mod" hidden><div class="mbox"><button class="mx" aria-label="閉じる">×</button><h3 id="mt"></h3><div id="mb"></div></div></div>
  <div id="title">
    <h1>ミナトの帳簿</h1>
    <p>取引45の型</p>
    <button id="t-new">はじめから</button>
    <button id="t-cont" hidden>つづきから</button>
    <button id="t-map">型マップ</button>
    <small>音が出ます。タップ／Enter／Spaceで進みます。</small>
  </div>
  <div id="toast"></div>
</div>
<script src="bible.js"></script>
<script src="nv.js"></script>
</body>
</html>
